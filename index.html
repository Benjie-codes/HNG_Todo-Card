<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Card — Testable Todo Item</title>
  <meta name="description" content="" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <main>
    <h1 class="visually-hidden">My Tasks</h1>

    <article data-testid="test-todo-card" aria-labelledby="todo-title-task-001" class="todo-card">

      <header class="card-header">
        <div class="card-meta-row">
          <div class="priority-group">
            <span data-testid="test-todo-priority-indicator" class="priority-indicator priority-indicator--high"
              aria-label="Priority: High"></span>
            <span data-testid="test-todo-priority" class="badge badge--high" aria-label="Priority: High"
              role="status">High</span>
          </div>
          <span data-testid="test-todo-status" class="badge badge--in-progress" aria-label="Status: In Progress"
            role="status">In Progress</span>
          <select data-testid="test-todo-status-control" class="status-control status-control--in-progress"
            aria-label="Change status">
            <option value="Pending">Pending</option>
            <option value="In Progress" selected>In Progress</option>
            <option value="Done">Done</option>
          </select>
        </div>

        <label for="toggle-task-001" class="toggle-label">
          <input type="checkbox" id="toggle-task-001" data-testid="test-todo-complete-toggle"
            aria-label="Mark 'Finalize Design System Tokens' as complete" />
          Mark complete
        </label>

        <h2 data-testid="test-todo-title" id="todo-title-task-001">
          Build a Todo Card
        </h2>
      </header>

      <div class="card-body">
        <div class="collapsible-section" data-testid="test-todo-collapsible-section" id="todo-description-section">
          <p data-testid="test-todo-description">
            Make sure to start quick, and also do reseach. Thanks HNG
          </p>
          <div class="collapsible-fade"></div>
        </div>
        <button type="button" data-testid="test-todo-expand-toggle" class="expand-toggle" aria-expanded="false"
          aria-controls="todo-description-section" style="display: none;">
          <svg class="expand-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" aria-hidden="true" focusable="false">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
          <span class="expand-label">Show more</span>
        </button>

        <ul data-testid="test-todo-tags" role="list" aria-label="Tags">
          <li data-testid="test-todo-tag-work">Work</li>
          <li data-testid="test-todo-tag-urgent">Urgent</li>
          <li data-testid="test-todo-tag-design">Design</li>
        </ul>
      </div>

      <form class="edit-form" data-testid="test-todo-edit-form" novalidate>
        <div class="edit-form-field">
          <label class="edit-label" for="edit-title">Title</label>
          <input type="text" id="edit-title" data-testid="test-todo-edit-title-input" />
          <span class="error-message" aria-live="polite"></span>
        </div>

        <div class="edit-form-field">
          <label class="edit-label" for="edit-description">Description</label>
          <textarea id="edit-description" data-testid="test-todo-edit-description-input"></textarea>
        </div>

        <div class="edit-form-field">
          <label class="edit-label" for="edit-priority">Priority</label>
          <select id="edit-priority" data-testid="test-todo-edit-priority-select">
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>

        <div class="edit-form-field">
          <label class="edit-label" for="edit-due-date">Due Date</label>
          <input type="date" id="edit-due-date" data-testid="test-todo-edit-due-date-input" />
        </div>

        <div class="edit-form-actions">
          <button type="submit" data-testid="test-todo-save-button" class="action-btn action-btn--save">Save</button>
          <button type="button" data-testid="test-todo-cancel-button" class="action-btn">Cancel</button>
        </div>
      </form>

      <footer class="card-footer">
        <div class="card-dates">
          <time data-testid="test-todo-due-date" datetime="2026-05-01T18:00:00Z">Due May 01, 2026</time>
          <time data-testid="test-todo-time-remaining" datetime="2026-05-01T18:00:00Z" aria-live="polite"
            aria-atomic="true" id="time-remaining">Calculating…</time>
        </div>

        <div class="card-actions">
          <button data-testid="test-todo-edit-button" type="button"
            aria-label="Edit task: Finalize Design System Tokens" class="action-btn action-btn--edit">
            <!-- SVG Pencil icon -->
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              aria-hidden="true" focusable="false">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            <span class="btn-label">Edit</span>
          </button>
          <button data-testid="test-todo-delete-button" type="button"
            aria-label="Delete task: Finalize Design System Tokens" class="action-btn action-btn--delete">
            <!-- SVG Trash icon -->
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              aria-hidden="true" focusable="false">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
            </svg>
            <span class="btn-label">Delete</span>
          </button>
        </div>
      </footer>
    </article>
  </main>

  <script src="script.js"></script>
</body>

</html>
